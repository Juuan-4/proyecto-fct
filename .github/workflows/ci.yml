name: Comprobaciones del proyecto

on:
  pull_request:
    branches:
      - main
  push:

jobs:
  comprobaciones:
    name: Comprobar aplicaci�n
    runs-on: ubuntu-latest

    steps:
      - name: Descargar c�digo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Revisar c�digo
        run: npm run lint

      - name: Compilar aplicaci�n
        run: npm run build
